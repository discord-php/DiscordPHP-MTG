name: Build Docs

on:
  release:
    types: [published]
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    # Runs on a published release, a manual dispatch, or a push whose head
    # commit message contains "build docs" (matching DiscordPHP's convention).
    if: >-
      github.event_name == 'release'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && contains(github.event.head_commit.message, 'build docs'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: iconv, mbstring
          tools: composer

      - name: Install phpDocumentor
        run: >-
          composer create-project discord-php/phpdoc-tool:^1.0 phpdoc-tool
          --no-interaction --no-progress
          --repository='{"type":"vcs","url":"https://github.com/discord-php/phpdoc-tool"}'

      - name: Build class reference
        run: php phpdoc-tool/vendor/bin/phpdoc --config phpdoc.dist.xml --no-interaction

      - name: Publish to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: build
          clean: true
